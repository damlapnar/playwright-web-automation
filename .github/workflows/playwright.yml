name: Playwright Tests

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 8 * * 1-5'

# A new push to the same PR/branch supersedes whatever's already running for
# it — cancel the stale run instead of burning CI minutes on a result nobody
# will look at. Scheduled runs get their own ref per invocation, so this
# never cancels one cron run mid-flight because another started.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Run ESLint
        run: npm run lint

      - name: Check formatting
        run: npm run format:check

      - name: Type check
        run: npx tsc --noEmit

      - name: Audit dependencies (critical only)
        run: npm audit --audit-level=critical

      - name: Dependency review
        if: github.event_name == 'pull_request'
        # Requires the repo's Dependency graph to be enabled (Settings →
        # Security) — an admin-only toggle this workflow can't flip. It's
        # been off since some point after 2026-07-18, so this step now
        # hard-fails "lint" on every real PR (dependabot's included, see
        # runs #67-81) for a reason that has nothing to do with what any of
        # those PRs actually changed. continue-on-error keeps the step
        # informative without it silently blocking merges on an unrelated
        # repo setting; remove this once Dependency graph is turned back on.
        continue-on-error: true
        uses: actions/dependency-review-action@v4

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - project: api
            installBrowser: ''
          - project: chromium
            installBrowser: chromium
          - project: firefox
            installBrowser: firefox
          - project: webkit
            installBrowser: webkit
          - project: mobile-chrome
            installBrowser: chromium
          - project: mobile-safari
            installBrowser: webkit

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Get installed Playwright version
        if: matrix.installBrowser != ''
        id: playwright-version
        run: echo "version=$(node -p "require('./package-lock.json').packages['node_modules/@playwright/test'].version")" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        if: matrix.installBrowser != ''
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-browsers-${{ runner.os }}-${{ steps.playwright-version.outputs.version }}

      - name: Install Playwright browsers
        if: matrix.installBrowser != ''
        # --with-deps always re-installs OS-level packages (fonts/libs) since
        # those aren't cached, but it skips re-downloading browser binaries
        # that the cache step above already restored at the matching version.
        run: npx playwright install --with-deps ${{ matrix.installBrowser }}

      - name: Run Playwright tests
        run: npx playwright test --project=${{ matrix.project }}
        env:
          BASE_URL: https://www.saucedemo.com

      - name: Write step summary
        if: always()
        run: python3 .github/scripts/write-step-summary.py
        env:
          MATRIX_PROJECT: ${{ matrix.project }}

      - name: Upload test report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report-${{ matrix.project }}
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 30

      - name: Generate Allure report
        if: always()
        run: npx allure generate allure-results --clean -o allure-report

      - name: Upload Allure report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: allure-report-${{ matrix.project }}
          path: allure-report/
          if-no-files-found: ignore
          retention-days: 30

  # Each matrix leg already writes its own step summary; this posts one
  # sticky PR comment aggregating the lint job and the test matrix as a
  # whole, so a reviewer sees pass/fail at a glance without opening the
  # Actions tab. Runs even when earlier jobs fail (that's the case it
  # matters most for) but only on pull_request — push/schedule runs have no
  # PR to comment on. Skipped for PRs from forks: GitHub always serves those
  # `pull_request` runs a read-only token regardless of the `permissions`
  # block below, so the comment call would just 403.
  pr-summary:
    needs: [lint, test]
    if: >-
      always() && github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pull-requests: write
    steps:
      - name: Comment CI summary on the PR
        uses: actions/github-script@v7
        with:
          script: |
            const lintResult = '${{ needs.lint.result }}';
            const testResult = '${{ needs.test.result }}';
            const icon = (r) => (r === 'success' ? '✅' : r === 'skipped' ? '⚪' : '❌');
            const marker = '<!-- playwright-ci-summary -->';
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;

            const body = [
              marker,
              '## Playwright CI Summary',
              '',
              '| Job | Result |',
              '|-----|--------|',
              `| Lint & typecheck | ${icon(lintResult)} ${lintResult} |`,
              `| Test matrix (api + browsers) | ${icon(testResult)} ${testResult} |`,
              '',
              `Per-project pass/fail counts and any failed/flaky test titles are in each matrix leg's [step summary](${runUrl}).`,
            ].join('\n');

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const existing = comments.find(
              (c) => c.user.type === 'Bot' && c.body.includes(marker)
            );

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }
